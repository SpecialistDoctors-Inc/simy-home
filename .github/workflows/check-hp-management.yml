name: Check standalone HP management

on:
  pull_request:
    paths: ['examples/hp-management/**', '.github/workflows/check-hp-management.yml']
  push:
    branches: [dev]
    paths: ['examples/hp-management/**', '.github/workflows/check-hp-management.yml']

permissions:
  contents: read

jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -m unittest discover -s examples/hp-management/runner -p 'test_*.py'
      - run: git diff --check
