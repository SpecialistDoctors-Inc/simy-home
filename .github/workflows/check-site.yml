name: Check Static Site

on:
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'tests/**'
      - 'infra/cloudfront-functions/**'
      - 'infra/terraform/**'
      - '.github/workflows/check-site.yml'
      - '.github/workflows/deploy-site.yml'
  push:
    branches: [main, dev]
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'tests/**'
      - 'infra/cloudfront-functions/**'
      - 'infra/terraform/**'
      - '.github/workflows/check-site.yml'
      - '.github/workflows/deploy-site.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check generated pages, SEO and routing
        run: |
          python3 scripts/build-localized-home.py --check
          python3 scripts/build-content-pages.py --check
          python3 scripts/site_header.py --check
          python3 scripts/check-home-seo.py
          python3 scripts/check-site-seo.py
          python3 scripts/organize-guide-intent.py --check
          node --test --test-concurrency=1 tests/*.test.cjs
          git diff --check

  copy-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/copy-browser" --no-package-lock --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/copy-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify 18-language copy on loopback
        env:
          COPY_BROWSER_OUTPUT: ${{ runner.temp }}/copy-browser-results
        run: NODE_PATH="$RUNNER_TEMP/copy-browser/node_modules" node tests/copy-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: copy-browser-results
          path: ${{ runner.temp }}/copy-browser-results
