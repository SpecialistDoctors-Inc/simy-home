<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ホームページの公開確認</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif;color:var(--color-text-primary,CanvasText);background:var(--color-background-primary,Canvas)}
*{box-sizing:border-box}body{margin:0;padding:20px;line-height:1.65}main{max-width:640px;margin:auto;border:1px solid var(--color-border-primary,ButtonBorder);border-radius:16px;padding:24px}h1{font-size:22px;font-weight:600;margin:8px 0 16px}p{margin:10px 0}.eyebrow{font-size:12px;color:var(--color-text-secondary,GrayText);margin:0}.summary{white-space:pre-wrap;overflow-wrap:anywhere}.links{padding:12px 0;display:grid;gap:12px}.links span{font-size:12px;color:var(--color-text-secondary,GrayText);display:block}.links a{color:var(--color-text-info,LinkText);font-size:14px;overflow-wrap:anywhere}button{font:inherit;border:1px solid var(--color-border-primary,ButtonBorder);border-radius:10px;padding:12px 18px;cursor:pointer;background:var(--color-background-info,ButtonFace);color:var(--color-text-primary,ButtonText)}button:disabled{opacity:.5;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid var(--color-border-info,Highlight);outline-offset:3px}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}.metadata{font-size:12px;color:var(--color-text-secondary,GrayText);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}#status{padding:12px;border-radius:8px;background:var(--color-background-secondary,ButtonFace);font-size:14px}#status[data-phase=error],#status[data-phase=expired]{border:1px solid var(--color-border-danger,ButtonBorder)}[hidden]{display:none!important}@media(max-width:420px){body{padding:8px}main{padding:16px}.actions button{width:100%}}
</style></head><body><main>
<p class="eyebrow">ホームページ管理</p><h1 id="site">ホームページの公開確認</h1>
<p id="summary" class="summary"></p><div class="links"><div><span>確認するプレビュー</span><a id="preview" target="_blank" rel="noopener noreferrer" hidden></a></div><div><span>公開先</span><a id="production" target="_blank" rel="noopener noreferrer" hidden></a></div></div>
<p id="status" role="status" aria-live="polite">確認情報を待っています。</p><p id="expiry" class="metadata"></p>
<div class="actions"><button id="confirm" type="button" disabled>この内容の公開を依頼する</button><button id="refresh" type="button" hidden>操作状況を確認</button></div>
<p id="operation" class="metadata"></p><p class="metadata">公開依頼の受付と公開完了は異なります。完了後に公開先の表示をご確認ください。</p>
</main><script type="module">/* APP_BUNDLE */</script></body></html>
